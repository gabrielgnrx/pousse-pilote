# Pile Supabase locale (supabase start), utilisée par le test de bout en bout en CI.
# Les migrations de supabase/migrations sont appliquées au démarrage.
project_id = "pousse-pilote"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = false
